[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs-fd"
version = "0.1.0"
description = "Composition and conditional support for open-set compound fault diagnosis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "torch>=2.6"]

[project.optional-dependencies]
prepare = ["pandas>=1.5"]

[project.scripts]
ccs-fd = "ccs_fd.__main__:main"

[tool.setuptools]
packages = ["ccs_fd", "training"]
py-modules = ["evaluate"]

[tool.setuptools.package-data]
ccs_fd = ["checkpoints/*.pt"]
